# elements/loadElements.yaml
appId: ${APP_ID}
---

- runScript: selectors/login.js
- runScript: selectors/navBar.js
- runScript: selectors/sellerDashboard.js
- runScript: selectors/addEditProduct.js
- runScript:
    file: clients/apiClients.js
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      API_URL: ${API_URL}
- runScript: 
    file: clients/generateData.js