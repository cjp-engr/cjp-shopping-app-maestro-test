appId: ${APP_ID}
name: "TC-090: Seller Creates Simple Product via Wizard"
# Description: Verifies that a seller can successfully create a simple (non-variant)
#              product listing using the wizard, and that the listing appears on the
#              Seller Dashboard after publishing.
tags:
  - add-product-simple
  - seller
  - smoke
  
---

- runFlow: ../0_auth/login_flow.yaml

- tapOn:
    id: ${output.navBar.sellerNavTab}
    label: "Tap Seller Navigation tab"
- tapOn:
    id: ${output.sellerDashboard.addProductFab}
    label: "Tap Add product button"

# --- Step 1: Basic Info ---
- tapOn:
    text: "Product Name"
- inputText: 
    text: ${output.PRODUCT_NAME}
    label: "Enter Product Name"
        

- tapOn:
    text: "Select a category"
    label: "Tap Category select field"
- tapOn:
    text: "Electronics"
    label: "Select category option"

- tapOn:
    text: "Brand (Optional)"
    label: "Tap Brand (Optional) text field"
- inputText: "Brand Test"

- tapOn:
    text: "Next"

# --- Step 2: Pricing ---
- tapOn:
    text: "Price ($)"
    label: "Tap Price ($) text field"
- inputText: "99.99"

- tapOn:
    text: "Stock"
    label: "Tap Stock text field"
- inputText: "100"

- tapOn:
    text: "SKU (Optional)"
    label: "Tap SKU (Optional) text field"
- inputText: "sku-100"

- tapOn:
    text: "Discount % (Optional)"
    label: "Tap Discount % (Optional) text field"
- inputText: "10"

- tapOn:
    text: "Next"

# --- Step 3: Description ---
- tapOn:
    text: "Description"
    label: "Tap Description text field"
- inputText: "Test Description"

- tapOn:
    text: "Next"

# --- Step 4: Images ---
- tapOn:
    text: "Add Photo"
- tapOn:
    text: "Paste image link"
- tapOn:
    text: "https://example.com/image.jpg"
- inputText: "https://picsum.photos/400/400"
- tapOn:
    text: "Add"

- tapOn:
    text: "Next"

# --- Step 5: Shipping ---
- tapOn:
    id: "${output.addEditProduct.shipping.expressButton}"
    label: "Select Express as buyer's shipping option"
- tapOn:
    id: "${output.addEditProduct.shipping.pickupButton}"
    label: "Select Pickup as buyer's shipping option"
- tapOn:
    id: "${output.addEditProduct.shipping.buyerPaysButton}"
    label: "Select Buyer Pays"
- tapOn:
    id: "${output.addEditProduct.shipping.standardFeeField}"
    label: "Tap Standard Fee text field"
- inputText: "5"
- tapOn:
    id: "${output.addEditProduct.shipping.expressFeeField}"
    label: "Tap Express Fee text field"
- inputText: "10"
- tapOn:
    id: "${output.addEditProduct.shipping.pickupFeeField}"
    label: "Tap Pickup Fee text field"
- inputText: "15"

- tapOn:
    text: "Next"

# --- Step 6: Review ---
- tapOn:
    text: "Publish Listing"

- assertVisible: "Seller Dashboard"

# Look up the product ID by name after UI creation
- runScript:
    file: ../../elements/clients/findProduct.js
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      API_URL: ${API_URL}
      PRODUCT_NAME: ${output.PRODUCT_NAME}
      
- assertVisible:
    id: "${output.sellerDashboard.list.category}${output.PRODUCT_ID}"
    text: "Electronics"
- assertVisible:
    id: "${output.sellerDashboard.list.productName}${output.PRODUCT_ID}"
    text: ${output.PRODUCT_NAME}
- assertVisible:
    id: "${output.sellerDashboard.list.price}${output.PRODUCT_ID}"
    text: "$99.99"
- assertVisible:
    id: "${output.sellerDashboard.list.stock}${output.PRODUCT_ID}"
    text: "Stock: 100"

# Teardown - delete via API
- runScript:
    file: ../../elements/clients/deleteProduct.js
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      API_URL: ${API_URL}
      PRODUCT_NAME: ${output.PRODUCT_NAME}
