appId: ${APP_ID}
---

- runFlow: ../../elements/loadElements.yaml
- launchApp:
    clearState: true

# Dismiss the push-permission prompt only if it appears
- runFlow:
    when:
      visible: 'Allow notifications?'
    commands:
      - tapOn: 'Allow'

- tapOn:
    id: ${output.login.loginEmailField}
- inputText: ${EMAIL}
- tapOn:
    id: ${output.login.loginPasswordField}
- inputText: ${PASSWORD}
- tapOn: 
    id: ${output.login.loginButton}
- assertVisible: "New Arrivals"
