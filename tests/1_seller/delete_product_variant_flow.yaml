appId: ${APP_ID}
name: "TC-620: Seller Deletes Variant Product from Dashboard"
# Description: Verifies that a seller can delete a variant product from the dashboard,
#              that a confirmation dialog appears before deletion, and that the
#              product tile is no longer visible after confirming.
tags:
  - delete-product-variant
  - seller
  - smoke

---

- runFlow: ../0_auth/login_flow.yaml

# Precondition: create a variant product via API and get its ID
- runScript:
    file: ../../elements/clients/createProduct.js
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      API_URL: ${API_URL}
      SETUP_VARIANT: "true"

# Navigate to Seller Dashboard
- tapOn:
    id: ${output.navBar.sellerNavTab}
    label: "Tap Seller Navigation tab"

- assertVisible:
    id: "product_tile_name_${output.ORIGINAL_PRODUCT_NAME}"

# Tap delete icon on the product tile
- tapOn:
    id: "${output.sellerDashboard.deleteProductButton}${output.ORIGINAL_PRODUCT_NAME}"
    label: "Tap Delete icon on product tile"

# Confirm deletion in the dialog
- assertVisible: 
    id: "${output.sellerDashboard.deleteDialog.dialogTitle}"
- tapOn:
    text: "Yes, Delete"
    label: "Confirm deletion"

# Assert product tile is gone from the dashboard
- assertNotVisible:
    id: "product_tile_name_${output.ORIGINAL_PRODUCT_NAME}"
