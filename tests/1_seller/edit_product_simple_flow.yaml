appId: ${APP_ID}
name: "TC-616: Seller Edits Simple Product via Wizard"
# Description: Verifies that a seller can open a simple product in edit mode,
#              change the name and price, and that the dashboard tile reflects
#              the updated values after publishing.
tags:
  - edit-product-simple
  - seller
  - smoke

---

- runFlow: ../0_auth/login_flow.yaml

# Generate the updated product name to type in the wizard
- runScript: ../../elements/clients/generateData.js

# Precondition: create a simple product via API and get its ID
- runScript:
    file: ../../elements/clients/createProduct.js
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      API_URL: ${API_URL}
      SETUP_SIMPLE: "true"

# Navigate to Seller Dashboard
- tapOn:
    id: ${output.navBar.sellerNavTab}
    label: "Tap Seller Navigation tab"

- assertVisible:
    id: "product_tile_name_${output.ORIGINAL_PRODUCT_NAME}"

# Tap edit icon on the product tile
- tapOn:
    id: "${output.sellerDashboard.editProductButton}${output.ORIGINAL_PRODUCT_NAME}"
    label: "Tap Edit icon on product tile"

# --- Step 1: Basic Info (pre-filled — change name only) ---
# 1. Select the entire text block
- longPressOn: 
    id: "${output.addEditProduct.basicInfo.productNameField}"
    label: "Long Press Product Name"
- tapOn: 
    text: "Select All"
    label: "Select All Product Name"
# 2. Perform a single backspace to clear the selection
- eraseText: 1
- inputText:
    text: ${output.PRODUCT_NAME}
    label: "Enter updated Product Name"

- tapOn:
    text: "Next"

# --- Step 2: Pricing (pre-filled — change price only) ---
- longPressOn:
    id: "${output.addEditProduct.pricing.simple.priceField}"
    label: "Tap Price text field"
- tapOn: 
    text: "Select All"
    label: "Select All Price text"
- eraseText: 1
- inputText: "149.99"
- longPressOn:
    id: "${output.addEditProduct.pricing.simple.stockField}"
    label: "Tap Stock text field"
- tapOn: 
    text: "Select All"
    label: "Select All Stock text"
- eraseText: 1
- inputText: "200"

- tapOn:
    text: "Next"

# --- Step 3: Description (pre-filled — advance only) ---
- tapOn:
    text: "Next"

# --- Step 4: Images (pre-filled — advance only) ---
- tapOn:
    text: "Add Photo"
- tapOn:
    text: "Paste image link"
- tapOn:
    text: "https://example.com/image.jpg"
- inputText: "https://picsum.photos/400/400"
- tapOn:
    text: "Add"
- tapOn:
    text: "Next"

# --- Step 5: Shipping (pre-filled — advance only) ---
- tapOn:
    id: "${output.addEditProduct.shipping.expressButton}"
    label: "Select Express as buyer's shipping option"
- tapOn:
    id: "${output.addEditProduct.shipping.pickupButton}"
    label: "Select Pickup as buyer's shipping option"
- tapOn:
    id: "${output.addEditProduct.shipping.buyerPaysButton}"
    label: "Select Buyer Pays"
- tapOn:
    id: "${output.addEditProduct.shipping.standardFeeField}"
    label: "Tap Standard Fee field"
- inputText: "5"
- tapOn:
    id: "${output.addEditProduct.shipping.expressFeeField}"
    label: "Tap Express Fee field"
- inputText: "10"
- tapOn:
    id: "${output.addEditProduct.shipping.pickupFeeField}"
    label: "Tap Pickup Fee field"
- inputText: "15"

- tapOn:
    text: "Next"

# --- Step 6: Review ---
- tapOn:
    text: "Save Changes"

- assertVisible: "Seller Dashboard"
- assertVisible:
    id: "product_tile_name_${output.PRODUCT_NAME}"

# Teardown - delete updated product via API (use new name after rename)
- runScript:
    file: ../../elements/clients/deleteProduct.js
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      API_URL: ${API_URL}
      PRODUCT_NAME: ${output.PRODUCT_NAME}
